name: sim-download

# Runs RetroPhone's full first-run flow in an iOS 26 Simulator: the app
# starts with an empty container, downloads iOS 4.2.1 (8C148) from
# Apple's servers itself (--rp-automation-download-8C148), verifies and
# imports it, creates a CPU-software machine and boots it. Screenshots,
# logs and the final container listing are uploaded as artifacts — the
# listing (Firmware/meta.json, a machine with rootfs-work.img) is the
# proof the download really happened inside the app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sim-download.yml'

permissions:
  contents: read

jobs:
  sim-download:
    name: iOS 26 Simulator first-run download (8C148, from Apple)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.46.0
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version

      - name: Build the app for the iOS Simulator
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p Generated
          python3 ../Engine/host/gen_a64_static.py \
            Generated/a64_static_handlers.S
          test -s Generated/a64_static_handlers.S
          xcodegen generate
          xcodebuild \
            -project RetroPhone.xcodeproj \
            -target RetroPhone \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$PWD/dist-sim" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -d "$PWD/dist-sim/RetroPhone.app"

      - name: Create and boot an iOS 26 simulator
        run: |
          set -euo pipefail
          mkdir -p simrun
          python3 - <<'PY'
          import json, subprocess, sys
          def j(args):
              return json.loads(subprocess.check_output(args))
          runtimes = j(["xcrun", "simctl", "list", "-j", "runtimes"])["runtimes"]
          ios26 = [r for r in runtimes
                   if r.get("isAvailable") and r["name"].startswith("iOS 26")]
          if not ios26:
              print("available runtimes:", file=sys.stderr)
              for r in runtimes:
                  print(" ", r["name"], r.get("isAvailable"), file=sys.stderr)
              sys.exit("no iOS 26 simulator runtime on this image")
          rt = sorted(ios26, key=lambda r: r["name"])[-1]
          types = j(["xcrun", "simctl", "list", "-j", "devicetypes"])["devicetypes"]
          import re
          def rank(t):
              m = re.match(r"iPhone (\d+)", t["name"])
              if m:
                  num = int(m.group(1))
              elif "SE (3rd" in t["name"]:
                  num = 13
              else:
                  return None
              tier = 3 if "Pro Max" in t["name"] else \
                     2 if "Pro" in t["name"] else \
                     1 if "Plus" in t["name"] else 0
              return (num, tier)
          phones = [(rank(t), t) for t in types
                    if t["name"].startswith("iPhone")]
          phones = sorted((p for p in phones if p[0] is not None),
                          key=lambda p: p[0], reverse=True)
          if not phones:
              sys.exit("no iOS 26-compatible iPhone device type found")
          print("runtime:", rt["name"], rt["identifier"])
          with open("simrun/sim.env", "w") as f:
              f.write("RUNTIME_ID=%s\n" % rt["identifier"])
          with open("simrun/devices.txt", "w") as f:
              for r, t in phones:
                  f.write(t["identifier"] + "\n")
          PY
          source simrun/sim.env
          UDID=""
          while read -r dtype; do
            if UDID=$(xcrun simctl create RetroPhoneSimDL "$dtype" "$RUNTIME_ID" 2>/dev/null); then
              echo "created with device type $dtype"
              break
            fi
            UDID=""
          done < simrun/devices.txt
          test -n "$UDID"
          echo "UDID=$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install the app (empty container — no seeding)
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" app/dist-sim/RetroPhone.app
          DATA=$(xcrun simctl get_app_container "$UDID" com.c12n.retrophone data)
          echo "data container: $DATA"
          find "$DATA" -type f | head -20 || true

      - name: Launch with the download automation argument and watch
        run: |
          set -euo pipefail
          mkdir -p shots simrun
          (xcrun simctl spawn "$UDID" log stream --style compact \
             --predicate 'process == "RetroPhone"' > simrun/simlog.txt 2>&1 &)
          xcrun simctl launch "$UDID" com.c12n.retrophone \
            --rp-automation-download-8C148
          sleep 10
          for i in $(seq 0 19); do
            xcrun simctl io "$UDID" screenshot \
              "shots/shot-$(printf %03d $i).png" || true
            sleep 60
          done
          xcrun simctl io "$UDID" screenshot shots/shot-final.png || true
          xcrun simctl terminate "$UDID" com.c12n.retrophone || true
          sleep 2
          pkill -f "log stream" || true
          xcrun simctl spawn "$UDID" log show --last 45m --style compact \
            --predicate 'process == "RetroPhone"' > simrun/logshow.txt 2>&1 || true
          DATA=$(xcrun simctl get_app_container "$UDID" com.c12n.retrophone data)
          find "$DATA/Documents" -type f -exec ls -lh {} \; \
            > simrun/container.txt || true
          cat simrun/container.txt || true
          xcrun simctl shutdown "$UDID" || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrophone-sim-download
          path: |
            shots/
            simrun/simlog.txt
            simrun/logshow.txt
            simrun/container.txt
          if-no-files-found: warn
