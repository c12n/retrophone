name: sim-run

# Runs RetroPhone in an iOS 26 Simulator on the runner with a pre-seeded
# iOS 4.2.1 (8C148) CPU-software machine, using the app's automation launch
# argument (--rp-automation-open-first-machine): the first machine opens
# and boots unattended, its disk being provisioned on first open exactly
# as a user's tap would. Screenshots and logs are uploaded as artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sim-run.yml'

permissions:
  contents: read

jobs:
  sim-run:
    name: iOS 26 Simulator guest run (8C148, CPU software)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          XCODEGEN_VERSION=2.46.0
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh
          xcodegen --version

      - name: Download iOS 4.2.1 (8C148) IPSW
        run: |
          set -euo pipefail
          mkdir -p simrun
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen(
                  "https://api.ipsw.me/v4/ipsw/iPhone1,2/8C148") as r:
              d = json.load(r)
          print("ipsw url:", d["url"])
          open("simrun/ipsw-url.txt", "w").write(d["url"])
          PY
          curl -fL --retry 3 -o simrun/iPhone1,2_4.2.1_8C148_Restore.ipsw \
            "$(cat simrun/ipsw-url.txt)"
          ls -lh simrun/

      - name: Build host fwimport and import the firmware set
        run: |
          set -euo pipefail
          mkdir -p hostbuild simrun/fw421imp
          cc -O2 -std=c11 \
            -I Engine/core/include -I Engine/host -I Engine/import \
            Engine/cli/fwimport.c Engine/import/*.c \
            Engine/core/src/firmware/aes.c Engine/core/src/firmware/img3.c \
            Engine/core/src/firmware/lzss.c Engine/host/sha256.c \
            -lz -lbz2 -o hostbuild/fwimport 2> simrun/cc.log || { cat simrun/cc.log; exit 1; }
          hostbuild/fwimport simrun/iPhone1,2_4.2.1_8C148_Restore.ipsw \
            --auto --out simrun/fw421imp
          ls -lh simrun/fw421imp

      - name: Build the app for the iOS Simulator
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p Generated
          python3 ../Engine/host/gen_a64_static.py \
            Generated/a64_static_handlers.S
          test -s Generated/a64_static_handlers.S
          xcodegen generate
          xcodebuild \
            -project RetroPhone.xcodeproj \
            -target RetroPhone \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$PWD/dist-sim" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -d "$PWD/dist-sim/RetroPhone.app"

      - name: Create and boot an iOS 26 simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          def j(args):
              return json.loads(subprocess.check_output(args))
          runtimes = j(["xcrun", "simctl", "list", "-j", "runtimes"])["runtimes"]
          ios26 = [r for r in runtimes
                   if r.get("isAvailable") and r["name"].startswith("iOS 26")]
          if not ios26:
              print("available runtimes:", file=sys.stderr)
              for r in runtimes:
                  print(" ", r["name"], r.get("isAvailable"), file=sys.stderr)
              sys.exit("no iOS 26 simulator runtime on this image")
          rt = sorted(ios26, key=lambda r: r["name"])[-1]
          types = j(["xcrun", "simctl", "list", "-j", "devicetypes"])["devicetypes"]
          import re
          def rank(t):
              m = re.match(r"iPhone (\d+)", t["name"])
              if m:
                  num = int(m.group(1))
              elif "SE (3rd" in t["name"]:
                  num = 13
              else:
                  return None  # X/XS/XR and older: not supported by iOS 26
              tier = 3 if "Pro Max" in t["name"] else \
                     2 if "Pro" in t["name"] else \
                     1 if "Plus" in t["name"] else 0
              return (num, tier)
          phones = [(rank(t), t) for t in types
                    if t["name"].startswith("iPhone")]
          phones = sorted((p for p in phones if p[0] is not None),
                          key=lambda p: p[0], reverse=True)
          if not phones:
              sys.exit("no iOS 26-compatible iPhone device type found")
          print("runtime:", rt["name"], rt["identifier"])
          for r, t in phones:
              print("candidate:", t["name"], t["identifier"])
          with open("simrun/sim.env", "w") as f:
              f.write("RUNTIME_ID=%s\n" % rt["identifier"])
          with open("simrun/devices.txt", "w") as f:
              for r, t in phones:
                  f.write(t["identifier"] + "\n")
          PY
          source simrun/sim.env
          UDID=""
          while read -r dtype; do
            if UDID=$(xcrun simctl create RetroPhoneSim "$dtype" "$RUNTIME_ID" 2>/dev/null); then
              echo "created with device type $dtype"
              break
            fi
            UDID=""
          done < simrun/devices.txt
          test -n "$UDID"
          echo "UDID=$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install the app and seed the 4.2.1 CPU-software machine
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" app/dist-sim/RetroPhone.app
          DATA=$(xcrun simctl get_app_container "$UDID" com.c12n.retrophone data)
          echo "data container: $DATA"
          mkdir -p "$DATA/Documents/Firmware" \
                   "$DATA/Documents/Machines/aabbccdd11223344"
          cp simrun/fw421imp/kernel.macho simrun/fw421imp/devicetree.bin \
             simrun/fw421imp/rootfs.img "$DATA/Documents/Firmware/"
          python3 - "$DATA/Documents/Firmware/import-policy-v1" <<'PY'
          import struct, sys
          sizes = (8343552, 42820, 681500672)
          b = bytearray(48)
          b[0:15] = b"S5LBoxFWPolicy1"
          b[16] = 0
          for i, s in enumerate(sizes):
              struct.pack_into("<Q", b, 24 + i * 8, s)
          open(sys.argv[1], "wb").write(bytes(b))
          PY
          printf '%s' '{"version":"4.2.1","build":"8C148"}' \
            > "$DATA/Documents/Firmware/meta.json"
          printf '%s' '{"id":"aabbccdd11223344","name":"iOS 4.2.1 CPU software","build":"8C148","softwareRender":true,"createdAt":783000000}' \
            > "$DATA/Documents/Machines/aabbccdd11223344/machine.json"
          find "$DATA/Documents" -type f -exec ls -lh {} \;

      - name: Launch with the automation argument and watch
        run: |
          set -euo pipefail
          mkdir -p shots
          (xcrun simctl spawn "$UDID" log stream --style compact \
             --predicate 'process == "RetroPhone"' > simrun/simlog.txt 2>&1 &)
          xcrun simctl launch "$UDID" com.c12n.retrophone \
            --rp-automation-open-first-machine
          sleep 10
          for i in $(seq 0 17); do
            xcrun simctl io "$UDID" screenshot \
              "shots/shot-$(printf %03d $i).png" || true
            sleep 60
          done
          xcrun simctl io "$UDID" screenshot shots/shot-final.png || true
          xcrun simctl terminate "$UDID" com.c12n.retrophone || true
          sleep 2
          pkill -f "log stream" || true
          xcrun simctl spawn "$UDID" log show --last 45m --style compact \
            --predicate 'process == "RetroPhone"' > simrun/logshow.txt 2>&1 || true
          DATA=$(xcrun simctl get_app_container "$UDID" com.c12n.retrophone data)
          find "$DATA/Documents" -type f -exec ls -lh {} \; \
            > simrun/container.txt || true
          xcrun simctl shutdown "$UDID" || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrophone-sim-run
          path: |
            shots/
            simrun/simlog.txt
            simrun/logshow.txt
            simrun/container.txt
            simrun/cc.log
          if-no-files-found: warn
